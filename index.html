<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #161d33; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #161d33; font-family: "Inter", sans-serif; color: #f2eee6; }
      .scene { position: absolute; inset: 0; overflow: hidden; background: #161d33; }
      .fade { position: absolute; inset: 0; }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .tint { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, rgba(45,58,94,0.30), rgba(22,29,51,0.72)); }
      .frame { position: absolute; left: 0; width: 1080px; overflow: hidden; box-shadow: 0 30px 90px rgba(0,0,0,0.55); }
      .pan { position: absolute; inset: 0; will-change: transform; }
      .pan img { display: block; width: 100%; height: 100%; }
      .sweep { position: absolute; inset: 0; background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.38) 50%, rgba(255,255,255,0) 62%); mix-blend-mode: screen; }
      .shade { position: absolute; left: 0; bottom: 0; width: 100%; height: 640px; background: linear-gradient(to top, rgba(22,29,51,0.96), rgba(22,29,51,0)); }
      .bar { width: 96px; height: 8px; border-radius: 4px; background: linear-gradient(90deg,#f2eee6,#ff7b5c); margin-bottom: 26px; }
      .cap { position: absolute; left: 80px; right: 80px; bottom: 330px; }
      .cap h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; text-shadow: 0 4px 24px rgba(0,0,0,0.5); }
      .brand { font-weight: 700; letter-spacing: -0.03em; background: linear-gradient(90deg,#f4f6fa 0%,#c9d2e0 45%,#e3b86a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .intro { position: absolute; left: 0; right: 0; top: 50%; margin-top: -230px; text-align: center; }
      .logo { display: block; width: 880px; height: auto; margin: 0 auto; }
      .intro h1 { font-size: 190px; line-height: 1.05; }
      .intro p { margin-top: 34px; font-size: 56px; font-weight: 600; color: #cfd0d6; }
      .glow { position: absolute; border-radius: 50%; filter: blur(130px); }
      .g1 { width: 900px; height: 900px; left: -350px; top: 100px; background: rgba(45,58,94,0.75); }
      .g2 { width: 700px; height: 700px; right: -300px; top: 1000px; background: rgba(226,85,45,0.22); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.5" data-width="1080" data-height="1920">
      <div id="s-intro" class="clip scene" data-start="0" data-duration="3.5" data-track-index="1">
        <div id="s-intro-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-intro-txt" class="intro">
            <img class="logo" src="assets/logo-lesna-lab.svg" alt="Lesna Lab" />
            <p>Oggetti unici, creati per te</p>
          </div>
        </div>
      </div>
      <div id="s0" class="clip scene" data-start="3.0" data-duration="4.5" data-track-index="1">
        <div id="s0-fade" class="fade">
          <img class="bg" src="assets/photos/b1-bg.jpg" alt="" />
          <div class="tint"></div>
          <div class="frame" style="top:416px;height:829px">
            <div id="s0-pan" class="pan" style="transform-origin:464px 464px"><img src="assets/photos/b1.jpg" alt="" /></div>
            <div id="s0-sw" class="sweep"></div>
          </div>
          <div class="shade"></div>
          <div id="s0-cap" class="cap"><div class="bar"></div><h2>Le tue coordinate</h2></div>
        </div>
      </div>
      <div id="s1" class="clip scene" data-start="7.0" data-duration="4.5" data-track-index="2">
        <div id="s1-fade" class="fade">
          <img class="bg" src="assets/photos/b2-bg.jpg" alt="" />
          <div class="tint"></div>
          <div class="frame" style="top:328px;height:1004px">
            <div id="s1-pan" class="pan" style="transform-origin:447px 707px"><img src="assets/photos/b2.jpg" alt="" /></div>
            <div id="s1-sw" class="sweep"></div>
          </div>
          <div class="shade"></div>
          <div id="s1-cap" class="cap"><div class="bar"></div><h2>Il tuo nome</h2></div>
        </div>
      </div>
      <div id="s2" class="clip scene" data-start="11.0" data-duration="4.5" data-track-index="1">
        <div id="s2-fade" class="fade">
          <img class="bg" src="assets/photos/b3-bg.jpg" alt="" />
          <div class="tint"></div>
          <div class="frame" style="top:461px;height:738px">
            <div id="s2-pan" class="pan" style="transform-origin:568px 512px"><img src="assets/photos/b3.jpg" alt="" /></div>
            <div id="s2-sw" class="sweep"></div>
          </div>
          <div class="shade"></div>
          <div id="s2-cap" class="cap"><div class="bar"></div><h2>Date e ricordi</h2></div>
        </div>
      </div>
      <div id="s3" class="clip scene" data-start="15.0" data-duration="4.5" data-track-index="2">
        <div id="s3-fade" class="fade">
          <img class="bg" src="assets/photos/b4-bg.jpg" alt="" />
          <div class="tint"></div>
          <div class="frame" style="top:432px;height:796px">
            <div id="s3-pan" class="pan" style="transform-origin:549px 432px"><img src="assets/photos/b4.jpg" alt="" /></div>
            <div id="s3-sw" class="sweep"></div>
          </div>
          <div class="shade"></div>
          <div id="s3-cap" class="cap"><div class="bar"></div><h2>Nome e simbolo</h2></div>
        </div>
      </div>
      <div id="s4" class="clip scene" data-start="19.0" data-duration="4.5" data-track-index="1">
        <div id="s4-fade" class="fade">
          <img class="bg" src="assets/photos/b5-bg.jpg" alt="" />
          <div class="tint"></div>
          <div class="frame" style="top:440px;height:779px">
            <div id="s4-pan" class="pan" style="transform-origin:589px 402px"><img src="assets/photos/b5.jpg" alt="" /></div>
            <div id="s4-sw" class="sweep"></div>
          </div>
          <div class="shade"></div>
          <div id="s4-cap" class="cap"><div class="bar"></div><h2>Iniziali e data</h2></div>
        </div>
      </div>
      <div id="s5" class="clip scene" data-start="23.0" data-duration="4.5" data-track-index="2">
        <div id="s5-fade" class="fade">
          <img class="bg" src="assets/photos/b6-bg.jpg" alt="" />
          <div class="tint"></div>
          <div class="frame" style="top:432px;height:797px">
            <div id="s5-pan" class="pan" style="transform-origin:581px 403px"><img src="assets/photos/b6.jpg" alt="" /></div>
            <div id="s5-sw" class="sweep"></div>
          </div>
          <div class="shade"></div>
          <div id="s5-cap" class="cap"><div class="bar"></div><h2>Il luogo del cuore</h2></div>
        </div>
      </div>
      <div id="s-outro" class="clip scene" data-start="27.0" data-duration="3.5" data-track-index="1">
        <div id="s-outro-fade" class="fade">
          <div class="glow g1"></div><div class="glow g2"></div>
          <div id="s-outro-txt" class="intro">
            <img class="logo" src="assets/logo-lesna-lab.svg" alt="Lesna Lab" />
            <p>Bracciali incisi su misura</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s-intro-txt", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 0.3);
      tl.to("#s-intro-fade", { opacity: 0, duration: 0.5, ease: "none" }, 3.0);
      tl.fromTo("#s0-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 3.0);
      tl.to("#s0-fade", { opacity: 0, duration: 0.5, ease: "none" }, 7.0);
      tl.fromTo("#s0-pan", { scale: 1, x: 0, y: 0 }, { scale: 1.08, duration: 2.1, ease: "sine.inOut" }, 3.0);
      tl.to("#s0-pan", { scale: 1.85, x: 76, y: -50, duration: 1.8, ease: "power2.inOut" }, 5.1);
      tl.fromTo("#s0-sw", { xPercent: -140 }, { xPercent: 140, duration: 1.7, ease: "power1.inOut" }, 3.5);
      tl.fromTo("#s0-cap", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.6);
      tl.fromTo("#s1-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 7.0);
      tl.to("#s1-fade", { opacity: 0, duration: 0.5, ease: "none" }, 11.0);
      tl.fromTo("#s1-pan", { scale: 1, x: 0, y: 0 }, { scale: 1.08, duration: 2.1, ease: "sine.inOut" }, 7.0);
      tl.to("#s1-pan", { scale: 1.85, x: 93, y: -205, duration: 1.8, ease: "power2.inOut" }, 9.1);
      tl.fromTo("#s1-sw", { xPercent: -140 }, { xPercent: 140, duration: 1.7, ease: "power1.inOut" }, 7.5);
      tl.fromTo("#s1-cap", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 7.6);
      tl.fromTo("#s2-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 11.0);
      tl.to("#s2-fade", { opacity: 0, duration: 0.5, ease: "none" }, 15.0);
      tl.fromTo("#s2-pan", { scale: 1, x: 0, y: 0 }, { scale: 1.08, duration: 2.1, ease: "sine.inOut" }, 11.0);
      tl.to("#s2-pan", { scale: 1.85, x: -28, y: -143, duration: 1.8, ease: "power2.inOut" }, 13.1);
      tl.fromTo("#s2-sw", { xPercent: -140 }, { xPercent: 140, duration: 1.7, ease: "power1.inOut" }, 11.5);
      tl.fromTo("#s2-cap", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 11.6);
      tl.fromTo("#s3-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 15.0);
      tl.to("#s3-fade", { opacity: 0, duration: 0.5, ease: "none" }, 19.0);
      tl.fromTo("#s3-pan", { scale: 1, x: 0, y: 0 }, { scale: 1.08, duration: 2.1, ease: "sine.inOut" }, 15.0);
      tl.to("#s3-pan", { scale: 1.85, x: -9, y: -34, duration: 1.8, ease: "power2.inOut" }, 17.1);
      tl.fromTo("#s3-sw", { xPercent: -140 }, { xPercent: 140, duration: 1.7, ease: "power1.inOut" }, 15.5);
      tl.fromTo("#s3-cap", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 15.6);
      tl.fromTo("#s4-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 19.0);
      tl.to("#s4-fade", { opacity: 0, duration: 0.5, ease: "none" }, 23.0);
      tl.fromTo("#s4-pan", { scale: 1, x: 0, y: 0 }, { scale: 1.08, duration: 2.1, ease: "sine.inOut" }, 19.0);
      tl.to("#s4-pan", { scale: 1.85, x: -49, y: -12, duration: 1.8, ease: "power2.inOut" }, 21.1);
      tl.fromTo("#s4-sw", { xPercent: -140 }, { xPercent: 140, duration: 1.7, ease: "power1.inOut" }, 19.5);
      tl.fromTo("#s4-cap", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 19.6);
      tl.fromTo("#s5-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 23.0);
      tl.to("#s5-fade", { opacity: 0, duration: 0.5, ease: "none" }, 27.0);
      tl.fromTo("#s5-pan", { scale: 1, x: 0, y: 0 }, { scale: 1.08, duration: 2.1, ease: "sine.inOut" }, 23.0);
      tl.to("#s5-pan", { scale: 1.85, x: -41, y: -4, duration: 1.8, ease: "power2.inOut" }, 25.1);
      tl.fromTo("#s5-sw", { xPercent: -140 }, { xPercent: 140, duration: 1.7, ease: "power1.inOut" }, 23.5);
      tl.fromTo("#s5-cap", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 23.6);
      tl.fromTo("#s-outro-fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 27.0);
      tl.fromTo("#s-outro-txt", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 27.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
