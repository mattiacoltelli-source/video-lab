name: Render video

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Titolo del video nella galleria"
        required: false
  push:
    paths:
      - ".github/workflows/render.yml"
      - "index.html"
      - "compositions/**"
      - "assets/**"
      - "hyperframes.json"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Using $CHROME"
          echo "HYPERFRAMES_BROWSER_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Lint composition
        run: npx --yes hyperframes@0.8.150 lint .

      - name: Check composition (non-blocking)
        continue-on-error: true
        run: npm run check

      - name: Render MP4
        run: npm run render -- . --output out/video.mp4 --fps 60 --quality delivery

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          if-no-files-found: error

      - name: Publish release (gallery)
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_INPUT: ${{ inputs.title }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          N="${{ github.run_number }}"
          TITLE="${TITLE_INPUT:-$(printf '%s' "$COMMIT_MSG" | head -n1)}"
          TITLE="${TITLE:-Video $N}"
          cp out/video.mp4 "out/video-$N.mp4"
          ffmpeg -y -loglevel error -ss 1 -i out/video.mp4 -frames:v 1 -vf scale=540:-2 "out/video-$N.jpg"
          gh release create "video-$N" "out/video-$N.mp4" "out/video-$N.jpg" \
            --title "$TITLE" --notes "Render automatico (run #$N)" --target "$GITHUB_SHA"
